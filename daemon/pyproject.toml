[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "streamplay"
version = "1.2.0"
description = "Control daemon for self-hosted music libraries with MPRIS2 support"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "websockets>=12",
    "secretstorage>=3",
    # dbus-python and PyGObject come from the distribution packages
    # (python-dbus, python-gobject) and are only needed for MPRIS.
]

[project.urls]
Homepage = "https://github.com/leissa/streamplay"
Issues = "https://github.com/leissa/streamplay/issues"

[project.scripts]
streamplayd = "streamplay.__main__:main"

[tool.setuptools.packages.find]
include = ["streamplay*"]
